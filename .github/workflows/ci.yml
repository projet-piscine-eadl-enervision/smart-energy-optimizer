name: CI

# Les jobs tournent sur ubuntu-24.04 et non ubuntu-latest, qui migre vers Ubuntu 26.04 :
# changer de version de runner se fait volontairement, par une PR, dans tous les workflows.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Une PR qui reçoit un nouveau push annule son run précédent. Sur main, chaque commit a son propre
# groupe et n'est jamais annulé ni remplacé : sans CI verte, un commit n'a pas d'image et ne peut
# pas être release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    # Le titre de la PR devient le message du squash : il doit suivre Conventional Commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            infra
            ci

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier le nom de la branche
        env:
          BRANCH: ${{ github.head_ref }}
        # Même script que le hook pre-commit local.
        run: bash infra/scripts/check-branch-name.sh "$BRANCH"

  commit-messages:
    # Vérifie chaque commit de la PR, pas seulement le titre. Dependabot est exclu : ses messages
    # contiennent des liens de plus de 100 caractères, que la règle de longueur refuse.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  # Les modules touchés par la PR (ou par le push sur main) : seuls leurs tests tournent. Un
  # changement commun (workflows, scripts d'infra, compose, hooks) ou une base introuvable les
  # active tous. Les contrôles de forme et le scan Trivy tournent toujours.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.modules.outputs.python }}
      frontend: ${{ steps.modules.outputs.frontend }}
      migrations: ${{ steps.modules.outputs.migrations }}
      terraform: ${{ steps.modules.outputs.terraform }}
      monitoring: ${{ steps.modules.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Contrôler les scripts d'infra (tri des modules, staging, release)
        run: |
          for t in test-changed-modules test-staging-deployment test-report-staging-deployment; do
            echo "== $t"
            bash "infra/scripts/$t.sh"
          done
          python3 infra/scripts/test-prefix-coverage.py
          python3 infra/scripts/test-check-zap-report.py
      - name: Modules touchés
        id: modules
        env:
          # Sur un push de main, pas de base : tout est testé (filet de sécurité, et Sonar a besoin de la
          # couverture de tous les modules pour son analyse de la branche).
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash infra/scripts/changed-modules.sh "$BASE" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  python:
    name: python (${{ matrix.component }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements*.txt
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
      - name: Installer les dépendances
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Outils de lint et de test figés dans requirements-dev.txt ; sans ce fichier (module qui n'en a pas encore), versions du jour
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install ruff pytest pytest-cov; fi
      - name: Base TimescaleDB migrée (tests d'intégration de l'API, de l'ETL et du ML)
        if: matrix.component == 'api' || matrix.component == 'etl' || matrix.component == 'ml'
        # Sans DATABASE_URL, les tests qui touchent la base sont ignorés. La base démarre deux fois (initialisation
        # puis service) : on attend les deux messages « ready » avant d'appliquer les migrations de db/.
        working-directory: .
        run: |
          docker run -d --name db -e POSTGRES_PASSWORD=ci -p 5432:5432 timescale/timescaledb:2.30.2-pg16
          until [ "$(docker logs db 2>&1 | grep -c 'ready to accept connections')" -ge 2 ]; do sleep 1; done
          docker build -q -t enervision-migrate db
          docker run --rm --network host \
            -e DATABASE_URL="postgres://postgres:ci@localhost:5432/postgres?sslmode=disable" \
            enervision-migrate up
          echo "DATABASE_URL=postgresql://postgres:ci@localhost:5432/postgres" >> "$GITHUB_ENV"
      - name: Lint (ruff)
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        run: ruff check .
      - name: Tests (pytest)
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        # code 5 = aucun test collecté : toléré tant que le composant démarre
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml || [ $? -eq 5 ]
      - name: Préparer la couverture pour Sonar
        if: hashFiles(format('{0}/coverage.xml', matrix.component)) != ''
        run: python3 ../infra/scripts/prefix-coverage.py coverage.xml "${{ matrix.component }}"
      - uses: actions/upload-artifact@v4
        if: hashFiles(format('{0}/coverage.xml', matrix.component)) != ''
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage.xml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present
      - name: Tests unitaires
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm test --if-present -- --coverage --coverage-reporters=lcov
      - name: Préparer la couverture pour Sonar
        if: hashFiles('frontend/coverage/enervision/lcov.info') != ''
        # Sonar lit les chemins depuis la racine du dépôt : src/app/app.ts devient frontend/src/app/app.ts
        run: sed -i 's#^SF:#SF:frontend/#' coverage/enervision/lcov.info
      - uses: actions/upload-artifact@v4
        if: hashFiles('frontend/coverage/enervision/lcov.info') != ''
        with:
          name: coverage-frontend
          path: frontend/coverage/enervision/lcov.info
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build --if-present

  # Tests de bout en bout : Cypress contre la vraie pile (base migrée, API, front), comme en local.
  # Seules les données externes manquent : aucune collecte, les écrans montrent leurs états vides.
  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || contains(needs.changes.outputs.python, '"api"')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      - name: Configurer la pile
        run: |
          {
            echo "MOCK_API_URL=http://mock.invalid"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Démarrer la pile
        run: docker compose up -d --build api frontend
      - name: Attendre le front et l'API
        run: |
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:4000/api/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail 80
          exit 1
      - name: Scénarios Cypress
        # Cypress tourne en utilisateur node (uid 1000) : le dossier doit être inscriptible pour les captures
        run: |
          chmod -R a+w frontend/cypress
          docker compose --profile e2e run --rm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --tail 80
      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

  # Scan DAST de l'API (OWASP ZAP), passif, contre une pile éphémère (base migrée, API) : le staging est
  # sur un réseau interne, injoignable depuis un exécuteur GitHub, et on ne scanne jamais la production.
  # Bloque sur les alertes hautes, sauf exception motivée dans infra/zap/rules.tsv.
  dast:
    needs: changes
    if: contains(needs.changes.outputs.python, '"api"')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configurer la pile
        run: |
          {
            echo "MOCK_API_URL=http://mock.invalid"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Démarrer l'API
        run: docker compose up -d --build api
      - name: Attendre l'API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail 80
          exit 1
      - name: Scan ZAP (passif)
        # ZAP tourne en utilisateur zap (uid 1000) : le dossier doit être inscriptible pour les rapports
        run: |
          chmod a+w infra/zap
          docker compose --profile dast run --rm zap
      - name: Alertes hautes
        run: python3 infra/scripts/check-zap-report.py infra/zap/zap-report.json infra/zap/rules.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: infra/zap/zap-report.*
          if-no-files-found: ignore
      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --tail 80
      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

  # Test de charge smoke de l'API (k6) sur une pile éphémère, comme le job dast : 5 utilisateurs pendant
  # une minute sur les routes du tableau de bord. Bloque si une requête échoue ou si la p95 dépasse 500 ms.
  # La base est vide : le job détecte une régression de latence ou une route cassée, pas une capacité.
  load:
    needs: changes
    if: contains(needs.changes.outputs.python, '"api"')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configurer la pile
        run: |
          {
            echo "MOCK_API_URL=http://mock.invalid"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Démarrer l'API
        run: docker compose up -d --build api
      - name: Attendre l'API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail 80
          exit 1
      - name: Créer le compte de test
        # Un compte créé par l'API est un user sans site (403 sur les données) : il passe admin en base
        run: |
          email="k6-ci@enervision-k6.fr"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          curl -fsS -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}" >/dev/null
          docker compose exec -T db psql -U postgres -d enervision -v ON_ERROR_STOP=1 \
            -c "UPDATE public.users SET role = 'admin' WHERE email = '$email'"
          {
            echo "K6_EMAIL=$email"
            echo "K6_PASSWORD=$password"
          } >> .env
      - name: Scénario smoke
        run: docker compose --profile load run --rm k6
      - name: Le seuil de latence fait bien échouer k6
        # Seuil impossible (p95 sous 1 ms) : k6 doit sortir en code 99, sinon les seuils ne protègent rien
        run: |
          set +e
          docker compose --profile load run --rm -e P95_MS=1 -e DURATION=10s k6
          code=$?
          set -e
          if [ "$code" -ne 99 ]; then
            echo "::error::k6 aurait dû échouer sur le seuil (code 99), code obtenu : $code"
            exit 1
          fi
          echo "Seuil dépassé détecté, comme attendu (code 99)"
      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --tail 80
      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (dépendances, secrets, configuration IaC)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, référence sûre de l'avis CVE-2026-33634 ; son actions/cache interne est en Node 20 (avertissement connu, voir CONTRIBUTING.md)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Terraform : format et validité du code, sans identifiants ni state (init sans backend). Le plan et
  # l'apply restent à la main depuis un poste (voir infra/terraform/aws/README.md).
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Format (terraform fmt)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff
      - name: Validité de la production AWS (terraform validate)
        working-directory: infra/terraform/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # Supervision : configuration de Prometheus et du blackbox, règles d'alerte et leurs tests, dashboards
  # Grafana et compose de supervision. Les images sont celles de docker-compose.monitoring.yml, pour
  # valider avec les versions déployées.
  monitoring:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-24.04
    env:
      # Le compose de supervision s'ajoute à celui du staging (postgres-exporter dépend de db) ;
      # valeurs factices pour les variables obligatoires
      COMPOSE_FILE: docker-compose.staging.yml:docker-compose.monitoring.yml
      GRAFANA_ADMIN_PASSWORD: ci
      POSTGRES_PASSWORD: ci
      SECRET_KEY: ci
      MOCK_API_URL: ci
      MOCK_API_USERNAME: ci
      MOCK_API_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - name: Compose de supervision
        run: docker compose config --quiet
      - name: Prometheus (promtool check config, test rules)
        run: |
          image=$(docker compose config --images | grep '^prom/prometheus:')
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool "$image" check config prometheus.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool "$image" test rules alerts.test.yml
      - name: Alertmanager (amtool check-config)
        run: |
          image=$(docker compose config --images | grep '^prom/alertmanager:')
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" -w /etc/alertmanager \
            --entrypoint amtool "$image" check-config alertmanager.yml
      - name: Blackbox (config.check)
        run: |
          image=$(docker compose config --images | grep '^prom/blackbox-exporter:')
          docker run --rm -v "$PWD/monitoring/blackbox:/etc/blackbox:ro" "$image" \
            --config.file=/etc/blackbox/blackbox.yml --config.check
      - name: Dashboards Grafana (JSON lisible, uid unique, sources provisionnées)
        run: python3 infra/scripts/check-dashboards.py monitoring/grafana/dashboards

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    # Les migrations de db/migrations s'appliquent sur une base vide, deux fois de suite (la seconde
    # ne doit rien changer), avec l'image db telle qu'elle sera publiée. Sur une PR, aucune migration
    # déjà fusionnée ne doit être modifiée, renommée ni supprimée : dbmate ne contrôle pas
    # les empreintes, c'est ce contrôle qui en tient lieu.
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Les migrations existantes ne changent pas
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changes=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" -- db/migrations)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Une migration déjà fusionnée ne se modifie pas : ajouter une nouvelle migration (voir CONTRIBUTING.md)."
            exit 1
          fi
      - name: Construire l'image db
        run: docker build -t enervision-migrate db
      - name: Appliquer les migrations (deux fois)
        run: |
          for _ in 1 2; do
            docker run --rm --network host \
              -e DATABASE_URL="postgres://postgres:ci@localhost:5432/postgres?sslmode=disable" \
              enervision-migrate up
          done
      - name: Aucune migration en attente
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://postgres:ci@localhost:5432/postgres?sslmode=disable" \
            enervision-migrate status | tee statut.txt
          grep -q "Pending: 0" statut.txt

  # Analyse SonarQube Cloud : qualité du code, couverture et porte de qualité (80 % de couverture sur
  # le code neuf). Elle échoue si la porte n'est pas franchie. Sans SONAR_TOKEN (PR venant d'un fork,
  # ou avant la mise en place de Sonar), les étapes sont ignorées et le job réussit.
  sonar:
    needs: [python, frontend]
    if: >-
      !cancelled()
      && needs.python.result != 'failure' && needs.python.result != 'cancelled'
      && needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled'
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # Sonar attribue les lignes nouvelles à partir de l'historique
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Analyse Sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # La porte de qualité bloque les PR. Sur main, l'analyse est publiée sans bloquer : un défaut
          # déjà fusionné ne doit pas empêcher la publication des images ni le staging.
          args: >
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
            -Dsonar.qualitygate.timeout=300

  # Point d'entrée unique pour la règle de protection de main :
  # seul ce job est à exiger, quels que soient les composants présents.
  ci-ok:
    if: always()
    needs: [pr-title, branch-name, commit-messages, changes, python, frontend, e2e, dast, load, security, terraform, migrations, sonar, monitoring]
    runs-on: ubuntu-24.04
    steps:
      - name: Vérifier les résultats
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi

  # Publication des images sur GHCR : seulement sur un push de main (donc jamais depuis une PR ni un
  # fork), une fois ci-ok vert. Chaque commit a son image :sha-<commit> ; :main n'avance que si ce
  # commit est encore la tête de main (c'est :main que la VM de staging récupère).
  publish:
    needs: ci-ok
    # always() : sans lui, le succès implicite exige que tous les ancêtres aient réussi, et les
    # contrôles réservés aux PR (pr-title, branch-name, commit-messages) sont ignorés sur un push.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.ci-ok.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module: [frontend, api, etl, ml, db]
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Version du commit (titre et sha court)
        id: version
        # Le message du commit est une entrée non fiable : il passe par l'environnement,
        # jamais directement dans le script. Seule la première ligne est gardée.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | tr -d '\r')
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Clé de réutilisation de l'image
        id: reuse
        env:
          MODULE: ${{ matrix.module }}
        run: |
          # La clé est l'empreinte Git du dossier du module (Dockerfile et fichiers compris) et la
          # semaine ISO : un module inchangé réutilise son image, mais chaque semaine tout est
          # reconstruit, pour reprendre les mises à jour de l'image de base (python, node...).
          # api est toujours reconstruite : /health y affiche le sha du commit, compilé dans l'image.
          tree=$(git rev-parse "HEAD:$MODULE")
          key="tree-${tree}-$(date -u +%GW%V)"
          reuse=false
          if [ "$MODULE" != api ] && docker buildx imagetools inspect "$IMAGE_PREFIX/$MODULE:$key" >/dev/null 2>&1; then
            reuse=true
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "Module $MODULE : clé $key, image réutilisée : $reuse"
      - name: Réutiliser l'image existante
        if: steps.reuse.outputs.reuse == 'true'
        env:
          MODULE: ${{ matrix.module }}
          KEY: ${{ steps.reuse.outputs.key }}
        run: docker buildx imagetools create -t "$IMAGE_PREFIX/$MODULE:sha-$GITHUB_SHA" "$IMAGE_PREFIX/$MODULE:$KEY"
      - uses: docker/build-push-action@v7
        if: steps.reuse.outputs.reuse != 'true'
        with:
          context: ${{ matrix.module }}
          push: true
          build-args: |
            GIT_TITLE=${{ steps.version.outputs.title }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ steps.reuse.outputs.key }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
      # Rapport seul pour l'instant : un échec du scan ou de l'envoi ne bloque pas la publication.
      # Seule une image construite est scannée ; une image réutilisée l'a été à sa construction, et
      # la reconstruction hebdomadaire renouvelle le rapport.
      - name: Trivy sur l'image (rapport, ne bloque pas)
        if: steps.reuse.outputs.reuse != 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, même version que le job security (voir CONTRIBUTING.md)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:sha-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.module }}.sarif
          limit-severities-for-sarif: true
          exit-code: "0"
      - name: Envoyer le rapport vers l'onglet Security
        if: steps.reuse.outputs.reuse != 'true' && !cancelled()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.module }}.sarif
          category: trivy-image-${{ matrix.module }}
      - name: Avancer :main si ce commit est encore la tête de main
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ matrix.module }}
        run: |
          # Deux merges rapprochés peuvent se terminer dans le désordre : seul le commit le plus
          # récent a le droit de déplacer :main, sinon un commit plus ancien ferait reculer le
          # staging. Les images sha-<commit> sont toutes conservées. Si le commit plus récent échoue
          # en CI, :main reste en retard jusqu'au prochain commit vert.
          tete=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tete" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_SHA::7} n'est plus la tête de main (${tete::7}) : :main n'est pas déplacé."
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE_PREFIX/$MODULE:main" "$IMAGE_PREFIX/$MODULE:sha-$GITHUB_SHA"
