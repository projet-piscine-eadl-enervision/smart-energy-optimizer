name: Publication des images

# Promotion des images : tag vX.Y.Z, posé à la main par le workflow Release après la recette. L'image
# du commit taggé reçoit le tag de version, sans reconstruction, pour que la production déploie
# exactement ce qui a été validé en staging.
# La construction des images de chaque commit (:sha-<commit> et :main) est dans ci.yml, job publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [frontend, api, etl, ml, db]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: hashFiles(format('{0}/Dockerfile', matrix.module)) != ''
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: hashFiles(format('{0}/Dockerfile', matrix.module)) != ''
      - name: Ajouter le tag de version à l'image du commit
        if: hashFiles(format('{0}/Dockerfile', matrix.module)) != ''
        run: |
          src="$IMAGE_PREFIX/${{ matrix.module }}:sha-$GITHUB_SHA"
          # Le tag est posé après la recette du staging, donc l'image du commit existe déjà. La
          # boucle d'attente ne sert que si le tag est créé à la main avant la fin de la publication.
          for i in $(seq 1 40); do
            if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$IMAGE_PREFIX/${{ matrix.module }}:$GITHUB_REF_NAME" "$src"
              exit 0
            fi
            echo "Image $src absente, nouvel essai dans 60 s ($i/40)"
            sleep 60
          done
          echo "::error::Image $src introuvable : la CI de ce commit a-t-elle réussi ?"
          exit 1
