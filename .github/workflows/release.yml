name: Release

# Release manuelle : la personne qui a fait la recette du staging fige la version sur le commit
# qu'elle a testé (Actions > Release > Run workflow), puis le même workflow promeut les images et
# lance le déploiement en production, qui attend l'approbation de l'environnement `production`.
# Le staging annonce lui-même à GitHub le commit qu'il fait tourner (déploiement « staging »,
# voir infra/scripts/report-staging-deployment.sh) : la release refuse un commit qu'il n'a pas annoncé.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Sha du commit recetté. Laisser vide pour prendre le dernier commit annoncé par le staging (onglet Deployments)"
        required: false
        type: string
      staging_verifie:
        description: "Je confirme avoir fait la recette du staging sur ce commit"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  deployments: read

# Une seule release à la fois.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Vérification manuelle du staging
        env:
          STAGING_VERIFIE: ${{ inputs.staging_verifie }}
        run: |
          if [ "$STAGING_VERIFIE" != "true" ]; then
            {
              echo "### Release refusée : recette non confirmée"
              echo
              echo "1. Vérifier dans l'onglet Deployments (environnement staging) que le staging est à jour sur le commit à livrer."
              echo "2. Recetter le staging."
              echo "3. Relancer le workflow avec la case cochée (et le sha, ou rien pour prendre le dernier commit du staging)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cocher la confirmation après avoir recetté le staging."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Vérifier le commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          # Sans sha saisi : le dernier commit que le staging a annoncé.
          if [ -z "$INPUT_SHA" ]; then
            INPUT_SHA=$(bash infra/scripts/staging-deployment.sh latest)
            echo "Commit pris du dernier déploiement staging : $INPUT_SHA"
          fi

          # Le sha est une entrée saisie à la main : format contrôlé avant tout usage.
          if ! grep -Eq '^[0-9a-f]{7,40}$' <<<"$INPUT_SHA"; then
            echo "::error::Sha invalide ($INPUT_SHA) : 7 à 40 caractères hexadécimaux en minuscules, tel que dans /health."
            exit 1
          fi

          if ! full=$(git rev-parse --verify --quiet "${INPUT_SHA}^{commit}"); then
            echo "::error::Sha $INPUT_SHA inconnu ou ambigu : copier la valeur de version.sha de /health."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$full" origin/main; then
            echo "::error::Le commit $full n'est pas sur main."
            exit 1
          fi

          # Le staging doit avoir annoncé ce commit (déploiement « staging » en succès).
          bash infra/scripts/staging-deployment.sh check "$full"

          tags=$(git tag --points-at "$full" --list 'v[0-9]*')
          if [ -n "$tags" ]; then
            echo "::error::Le commit $full porte déjà la version $tags."
            exit 1
          fi

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$full" 2>/dev/null || true)
          if [ -n "$last" ] && ! git merge-base --is-ancestor "$(git rev-list -n 1 "$last")" "$full"; then
            echo "::error::Le commit $full est plus ancien que $last."
            exit 1
          fi

          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$full" \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "aucune"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::La CI du commit $full n'est pas verte (résultat : $conclusion)."
            exit 1
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Calculer la version et publier la release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ steps.commit.outputs.full }}
          LAST: ${{ steps.commit.outputs.last }}
        run: |
          set -euo pipefail

          if [ -z "$LAST" ]; then last="v0.0.0"; range="$FULL_SHA"; else last="$LAST"; range="$last..$FULL_SHA"; fi

          subjects=$(git log "$range" --format='%s')
          bodies=$(git log "$range" --format='%b')

          # Conventional Commits : `!` ou BREAKING CHANGE = majeure, feat = mineure, fix = correctif.
          if grep -Eq '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q 'BREAKING CHANGE' <<<"$bodies"; then bump="major"
          elif grep -Eq '^feat(\([^)]*\))?:' <<<"$subjects"; then bump="minor"
          elif grep -Eq '^fix(\([^)]*\))?:' <<<"$subjects"; then bump="patch"
          else
            echo "::error::Aucun commit feat ou fix entre $last et ${FULL_SHA::7} : rien à publier."
            exit 1
          fi

          IFS=. read -r major minor patch <<<"${last#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Le tag $next existe déjà."
            exit 1
          fi

          {
            echo "### Release $next ($bump depuis $last)"
            echo
            echo "Commit : \`${FULL_SHA::7}\`. Le déploiement en production attend l'approbation de l'environnement \`production\`."
            echo
            echo "Contrôle avant d'approuver : \`GET http://10.43.43.50:8000/health\` du staging doit afficher le sha \`${FULL_SHA::7}\`."
            echo
            echo "Commits inclus :"
            echo
            echo '```'
            git log "$range" --format='%h %s'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Release $next ($bump depuis $last)"
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$FULL_SHA" \
            --title "$next" --generate-notes --latest
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  # Les images du commit reçoivent le tag de version (et leur SBOM est joint à la release), puis la
  # production est déployée. Les deux étapes sont des workflows réutilisables : plus de dépendance à
  # un tag poussé qui déclenche d'autres workflows.
  promote:
    needs: release
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
      packages: write

  deploy:
    needs: [release, promote]
    uses: ./.github/workflows/deploy-production.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      new_release: true
    permissions:
      contents: read
      packages: read
      id-token: write

