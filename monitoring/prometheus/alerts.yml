# Règles d'alerte évaluées par Prometheus (rule_files de prometheus.yml). Elles s'affichent dans
# Prometheus (/alerts) et dans Grafana (Alerting), et Alertmanager les envoie dans le canal Teams
# (monitoring/alertmanager/alertmanager.yml) quand TEAMS_WEBHOOK_URL est renseignée.
# Gravité : critical = service rendu indisponible ; warning = à regarder avant que ça le devienne.
# Test : promtool test rules alerts.test.yml (depuis ce dossier)
groups:
  - name: disponibilite
    rules:
      - alert: CibleInjoignable
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ne répond plus à Prometheus"
          description: "La cible {{ $labels.instance }} (job {{ $labels.job }}) n'est plus collectée depuis 2 minutes."

      - alert: SondeHttpEnEchec
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ne répond pas en 2xx"
          description: "La sonde HTTP de {{ $labels.instance }} échoue depuis 2 minutes."

      - alert: BaseInjoignable
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL injoignable"
          description: "postgres-exporter n'arrive plus à se connecter à la base depuis 1 minute."

  - name: hote
    rules:
      - alert: DisquePresquePlein
        expr: 1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disque {{ $labels.mountpoint }} rempli à plus de 80 %"
          description: "Occupation : {{ $value | humanizePercentage }}."

      - alert: DisquePlein
        expr: 1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disque {{ $labels.mountpoint }} rempli à plus de 90 %"
          description: "Occupation : {{ $value | humanizePercentage }}. La base et Prometheus risquent de s'arrêter."

      - alert: MemoireSaturee
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire de l'hôte utilisée à plus de 90 %"
          description: "Utilisation : {{ $value | humanizePercentage }}."

      - alert: CpuSature
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU de l'hôte occupé à plus de 90 %"
          description: "Utilisation moyenne : {{ $value | humanizePercentage }} depuis 15 minutes."

  # Minuteurs systemd du projet (collecteur systemd de node-exporter) : mise à jour du staging et
  # tâches ML, avec leurs variantes -production. Un minuteur absent de la machine ne produit aucune série.
  - name: taches-planifiees
    rules:
      # Un service oneshot reste « failed » jusqu'au lancement réussi suivant (ou systemctl reset-failed)
      - alert: TachePlanifieeEnEchec
        expr: node_systemd_unit_state{name=~".+\\.service", state="failed"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} en échec"
          description: "Le dernier lancement de {{ $labels.name }} a échoué : journalctl -u {{ $labels.name }} -n 50 sur la machine. Pour monitor-ml, le code 2 signale une dérive du modèle (vue ml.model_health)."

      - alert: MinuteurArrete
        expr: node_systemd_unit_state{name=~".+\\.timer", state="active"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} arrêté"
          description: "Le minuteur {{ $labels.name }} n'est plus actif : systemctl enable --now {{ $labels.name }} sur la machine."

      # Seuil par minuteur : un peu plus que sa période. Un minuteur jamais déclenché (dernier
      # déclenchement à 0, juste après l'installation) est ignoré.
      - alert: MinuteurEnRetard
        expr: |
          (
              (time() - node_systemd_timer_last_trigger_seconds{name="update-staging.timer"} > 600)
            or
              (time() - node_systemd_timer_last_trigger_seconds{name=~"predict-ml(-production)?\\.timer"} > 7200)
            or
              (time() - node_systemd_timer_last_trigger_seconds{name=~"monitor-ml(-production)?\\.timer"} > 93600)
            or
              (time() - node_systemd_timer_last_trigger_seconds{name=~"train-ml(-production)?\\.timer"} > 691200)
          )
          and node_systemd_timer_last_trigger_seconds > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} ne s'est pas déclenché à l'heure"
          description: "Dernier déclenchement il y a {{ $value | humanizeDuration }} : systemctl list-timers sur la machine."

  - name: application
    rules:
      - alert: ApiTropDErreurs
        expr: sum(rate(http_requests_total{job="api", status="5xx"}[5m])) / sum(rate(http_requests_total{job="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 5 % d'erreurs 5xx sur l'API"
          description: "Part des réponses 5xx sur 5 minutes : {{ $value | humanizePercentage }}."

      - alert: ApiLente
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="api"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API lente : 95e centile au-dessus d'1 s"
          description: "95 % des requêtes répondent en moins de {{ $value | humanizeDuration }}."

      # Force brute ou bourrage d'identifiants sur /auth/login : échecs et blocages (401, 429) cumulés
      - alert: ConnexionsEnEchec
        expr: sum(increase(auth_login_attempts_total{job="api", outcome!="success"}[10m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pic d'échecs de connexion sur l'API"
          description: "{{ $value | humanize }} connexions refusées en 10 minutes (mot de passe faux ou tentative bloquée). Voir les logs « login failed » et « login blocked » de l'API."

      # Ne sonne que si la base contient des mesures : sans collecteur (production par défaut), la table
      # est vide, la métrique est absente et l'alerte reste muette.
      - alert: EtlSansNouvelleMesure
        expr: time() - etl_latest_reading_timestamp_seconds > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Aucune nouvelle mesure depuis plus de 10 minutes"
          description: "Dernière mesure reçue il y a {{ $value | humanizeDuration }}. Vérifier le collecteur et l'API Mock."

      - alert: EtlDerniereExecutionEnEchec
        expr: etl_last_run_timestamp_seconds{status="failed"}
        labels:
          severity: warning
        annotations:
          summary: "Dernière exécution {{ $labels.run_type }} en échec"
          description: "Voir error_message dans la table etl.run."

      - alert: EtlBaseIllisible
        expr: etl_metrics_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "L'ETL n'arrive plus à lire la base"
          description: "Les métriques de l'ETL (etl.run, core.energy_reading) ne sont plus calculées."
