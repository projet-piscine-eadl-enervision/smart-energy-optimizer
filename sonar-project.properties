# Analyse SonarQube Cloud (job sonar de .github/workflows/ci.yml).
# L'organisation et la clé du projet sont ceux de SonarQube Cloud (Project information).
sonar.organization=projet-piscine-eadl-enervision
sonar.projectKey=projet-piscine-eadl-enervision_smart-energy-optimizer
sonar.projectName=EnerVision Smart Energy Optimizer

# Code analysé et tests
sonar.sources=api/app,etl,ml,frontend/src
sonar.tests=api/tests,etl/tests,ml/tests,frontend/src
sonar.test.inclusions=**/tests/**,**/*.spec.ts
sonar.host.url=https://sonarcloud.io
sonar.exclusions=coverage-reports/**,**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/tests/**,**/*.spec.ts,etl/pipeline/provided_files/**,etl/pipeline/edited_files/**
sonar.coverage.exclusions=**/tests/**,**/*.spec.ts,**/main.ts,**/main.server.ts,**/server.ts,**/*.config.ts

# Couverture produite par la CI (artefacts coverage-<module>)
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage-reports/coverage-api/coverage.xml,coverage-reports/coverage-etl/coverage.xml,coverage-reports/coverage-ml/coverage.xml
sonar.javascript.lcov.reportPaths=coverage-reports/coverage-frontend/lcov.info
