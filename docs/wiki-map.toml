# Pages du wiki générées depuis le dépôt (infra/scripts/sync-wiki.py).
# L'ordre des entrées fixe l'ordre des pages dans la barre latérale. Le titre devient le nom de
# la page : lettres, chiffres et espaces seulement. `optional = true` : la page est ignorée tant
# que le fichier n'existe pas (par exemple ml/README.md, absent de main avant sa fusion).
# Tout README.md, CONTRIBUTING.md, SECURITY.md et docs/*.md versionné doit figurer ici ou dans
# `ignore` : sinon `sync-wiki.py --check` échoue.

repo = "projet-piscine-eadl-enervision/smart-energy-optimizer"
ignore = []

