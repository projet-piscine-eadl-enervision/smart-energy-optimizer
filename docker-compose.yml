services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    container_name: enervision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enervision}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique db/migrations puis s'arrête (restart "no" : un service ponctuel relancé en boucle
  # fausserait service_completed_successfully). Le dossier est monté par-dessus celui de l'image :
  # une nouvelle migration est prise en compte sans reconstruire, avec docker compose run --rm migrate
  migrate:
    build: ./db
    container_name: enervision-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-enervision}?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    container_name: enervision-api
    restart: unless-stopped
    # Fournit MOCK_API_URL, obligatoire (plus de valeur par défaut dans le code) : voir .env.example
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-enervision}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  etl:
    build: ./etl
    container_name: enervision-etl
    restart: unless-stopped
    # Fournit MOCK_API_URL, obligatoire (plus de valeur par défaut dans le code) : voir .env.example
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-enervision}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${ETL_PORT:-8001}:8000"
    volumes:
      - ./etl:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Collecteur des mesures courantes du mock. Profil à part : sans lui, chaque poste interrogerait le
  # mock partagé toutes les minutes. docker compose --profile collector up -d collector
  collector:
    profiles: [collector]
    build: ./etl
    container_name: enervision-collector
    restart: unless-stopped
    # Fournit MOCK_API_URL, obligatoire (plus de valeur par défaut dans le code) : voir .env.example
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-enervision}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    command: python -m pipeline poll-current
    volumes:
      - ./etl:/app
    # La sonde du Dockerfile interroge le port 8000, que ce service n'ouvre pas : on contrôle le dernier
    # tour réussi (trois intervalles au plus). start_period couvre le premier tour.
    healthcheck:
      test: ["CMD", "python", "-m", "pipeline.heartbeat"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: enervision-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    environment:
      # Adresse de l'API pour le proxy /api/ (frontend/src/api-proxy.ts), obligatoire.
      # HTTP sur le réseau Docker interne, jamais exposé.
      API_UPSTREAM: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  # Tests de bout en bout (Cypress). Lancé seulement à la demande, une fois la pile démarrée :
  #   docker compose up -d
  #   docker compose --profile e2e run --rm e2e
  # Partage le réseau du conteneur frontend : Cypress joint l'application sur localhost:4000,
  # comme un navigateur sur le poste. Aucun Node ni Cypress à installer dans WSL.
  e2e:
    image: cypress/included:16.1.1
    container_name: enervision-e2e
    profiles: [e2e]
    restart: "no"
    network_mode: "service:frontend"
    # Utilisateur node (uid 1000) : les captures d'écran appartiennent à l'utilisateur WSL, pas à root
    user: node
    working_dir: /e2e
    # Chrome plutôt qu'Electron, déclaré obsolète par Cypress. Arguments ajoutés à « cypress run »
    command: ["--browser", "chrome"]
    volumes:
      - ./frontend/cypress:/e2e
    depends_on:
      - frontend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    container_name: enervision-mlflow
    restart: unless-stopped
    # --allowed-hosts : en-têtes Host acceptés (le service ml appelle http://mlflow:5000)
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ml:
    build: ./ml
    container_name: enervision-ml
    # Lancé seulement à la demande : docker compose run --rm ml
    profiles: [ml]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-enervision}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Adresse à ouvrir depuis le poste, affichée à la fin de l'entraînement
      MLFLOW_PUBLIC_URL: http://localhost:${MLFLOW_PORT:-5000}
    volumes:
      - ./ml:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  mlflow-data:
