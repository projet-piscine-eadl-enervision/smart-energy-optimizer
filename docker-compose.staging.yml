# Staging (et base de la production) : images construites par la CI et publiées sur GHCR.
# Variables lues dans /etc/enervision/staging.env sur la VM, ou /etc/enervision/production.env sur
# l'instance de production (jamais dans le dépôt).
#
# La base et l'API démarrent toujours. Les autres applications sont dans le profil `apps` :
# elles sont activées avec COMPOSE_PROFILES=apps dans le fichier d'environnement, quand leur image
# existe sur GHCR (un module n'est publié que s'il a un Dockerfile).
# Les variables POSTGRES_PASSWORD et MOCK_API_* doivent toujours être présentes dans ce fichier.
#
# Module ML : le suivi des modèles (profil `mlflow`) s'ajoute à COMPOSE_PROFILES ; l'entraînement et la
# prévision se lancent à la demande avec `run --rm ml` (profil `ml-job`, jamais dans COMPOSE_PROFILES :
# sinon chaque mise à jour relancerait l'entraînement).
name: enervision

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
      POSTGRES_USER: ${POSTGRES_USER:-enervision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans staging.env ou production.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applique les migrations de l'image db (même tag que le reste) puis s'arrête. restart "no" :
  # un service ponctuel relancé en boucle fausserait service_completed_successfully.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/projet-piscine-eadl-enervision/smart-energy-optimizer}/db:${IMAGE_TAG:-main}
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-enervision}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enervision}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/projet-piscine-eadl-enervision/smart-energy-optimizer}/api:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql://${POSTGRES_USER:-enervision}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enervision}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant dans staging.env ou production.env}
      MOCK_API_URL: ${MOCK_API_URL:?MOCK_API_URL manquant dans staging.env ou production.env}
      MOCK_API_USERNAME: ${MOCK_API_USERNAME:?MOCK_API_USERNAME manquant dans staging.env ou production.env}
      MOCK_API_PASSWORD: ${MOCK_API_PASSWORD:?MOCK_API_PASSWORD manquant dans staging.env ou production.env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  etl:
    profiles: [apps]
    image: ${IMAGE_PREFIX:-ghcr.io/projet-piscine-eadl-enervision/smart-energy-optimizer}/etl:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enervision}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enervision}
      MOCK_API_URL: ${MOCK_API_URL:?MOCK_API_URL manquant dans staging.env ou production.env}
      MOCK_API_USERNAME: ${MOCK_API_USERNAME:?MOCK_API_USERNAME manquant dans staging.env ou production.env}
      MOCK_API_PASSWORD: ${MOCK_API_PASSWORD:?MOCK_API_PASSWORD manquant dans staging.env ou production.env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Collecteur des mesures courantes du mock. Profil à part, à activer par environnement :
  # COMPOSE_PROFILES=apps,collector dans /etc/enervision/staging.env (et dans production.env le jour où
  # la production doit collecter).
  collector:
    profiles: [collector]
    image: ${IMAGE_PREFIX:-ghcr.io/projet-piscine-eadl-enervision/smart-energy-optimizer}/etl:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enervision}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enervision}
      MOCK_API_URL: ${MOCK_API_URL:?MOCK_API_URL manquant dans staging.env}
      MOCK_API_USERNAME: ${MOCK_API_USERNAME:?MOCK_API_USERNAME manquant dans staging.env}
      MOCK_API_PASSWORD: ${MOCK_API_PASSWORD:?MOCK_API_PASSWORD manquant dans staging.env}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    command: python -m pipeline poll-current
    # La sonde du Dockerfile interroge le port 8000, que ce service n'ouvre pas : on contrôle le dernier
    # tour réussi (trois intervalles au plus). start_period couvre le premier tour.
    healthcheck:
      test: ["CMD", "python", "-m", "pipeline.heartbeat"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Suivi et registre des modèles du module ML (alias champion et challenger). Sans authentification :
  # lié à 127.0.0.1 de la VM, accès par tunnel SSH. À activer avec COMPOSE_PROFILES=...,mlflow.
  mlflow:
    profiles: [mlflow]
    image: ghcr.io/mlflow/mlflow:v3.17.2
    restart: unless-stopped
    # --allowed-hosts : en-têtes Host acceptés (le service ml appelle http://mlflow:5000)
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Entraînement du modèle (commande par défaut) ou prévision, à la demande :
  #   docker compose ... run --rm ml
  #   docker compose ... run --rm ml python -m enervision_ml.predict
  # Demande mlflow démarré. APP_ENV : scripts/seed_dev.py refuse de tourner hors développement.
  ml:
    profiles: [ml-job]
    image: ${IMAGE_PREFIX:-ghcr.io/projet-piscine-eadl-enervision/smart-energy-optimizer}/ml:${IMAGE_TAG:-main}
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql://${POSTGRES_USER:-enervision}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enervision}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Adresse à ouvrir depuis le poste (tunnel SSH, voir ml/README.md), affichée à la fin de l'entraînement
      MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5001}
      # Fin figée du jeu d'entraînement (ISO, UTC) ; vide : minuit UTC du jour
      ML_DATA_END: ${ML_DATA_END:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: [apps]
    image: ${IMAGE_PREFIX:-ghcr.io/projet-piscine-eadl-enervision/smart-energy-optimizer}/frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      # Adresse de l'API à laquelle le serveur transmet /api/ (lue au lancement)
      API_UPSTREAM: http://api:8000
      # Nom ou IP sous lesquels le site est joint (IP de la VM en staging, adresse AWS en production)
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - api
    ports:
      - "4000:4000"

volumes:
  db_data:
  mlflow_data:
